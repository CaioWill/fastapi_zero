name: pipeline
on: ['push', 'pull_request']

#job - trabalho
jobs:
  # nome do job
  test:
    # qual so
    runs-on: ubunto-latest

    steps:
      - name: Instalar o Python
        # Uses action pronta
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
    
      - name: Instalar o Poetry
        run: pipx install poetry

      - name: Instalando as dependễncias
        run: poetry install

      - name: ativando ambiente virtual
        run: poetry shell

      - name: Execuntando o Linter
        run: poetrt lint

      - name: Executando os testes
        run: poetry test 