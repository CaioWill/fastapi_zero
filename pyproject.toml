[project]
name = "fastapi-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "CaioWill",email = "caio5.william5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = ['-p', 'no:warnings']


[tool.poe.tasks]
lint = "ruff check"
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
server = "fastapi dev fastapi_zero/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv --cov=fastapi_zero $POE_EXTRA_ARGS" },
  { cmd = "coverage html" },
]


[tool.poe]
poetry_command = ""